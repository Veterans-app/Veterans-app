# Configuración para Render (https://render.com): "New +" -> "Blueprint" y elige tu repositorio.
services:
  - type: web
    name: veterans-1a-divisio
    runtime: node
    region: frankfurt        # el más cercano a España
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: CACHE_TTL_SECONDS
        value: "600"
